<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuner — Soundback & Pitch</title>
  <meta name="description" content="マイクによるピッチ検出と、検出音の正しい基準音を動的再生するサウンドバック">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="noise"></div>
  </div>

  <main class="app">
    <header class="header">
      <a href="../" class="back-link" aria-label="Portalへ戻る">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Portal</span>
      </a>
      <h1 class="title">Tuner</h1>
      <p class="subtitle">Pitch Detection · Soundback</p>
    </header>

    <section class="panel tuner-panel" aria-labelledby="tuner-heading">
      <div class="panel-head">
        <h2 id="tuner-heading" class="panel-title">Tuner</h2>
        <button type="button" id="mic-toggle" class="btn btn-primary" aria-pressed="false">
          <span class="btn-icon" aria-hidden="true">
            <svg class="icon-mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </span>
          <span class="btn-label">マイク開始</span>
        </button>
      </div>

      <div class="meter-wrap">
        <div class="note-display" id="note-display">
          <span class="note-name" id="note-name">—</span>
          <span class="note-octave" id="note-octave"></span>
        </div>
        <div class="cents-meter" role="meter" aria-valuemin="-50" aria-valuemax="50" aria-valuenow="0" id="cents-meter">
          <div class="cents-track">
            <div class="cents-center"></div>
            <div class="cents-needle" id="cents-needle"></div>
          </div>
          <div class="cents-labels">
            <span>−50</span>
            <span>0</span>
            <span>+50</span>
          </div>
        </div>
        <p class="freq-readout"><span id="freq-value">—</span> <span class="unit">Hz</span></p>
        <p class="cents-readout" id="cents-value">— cents</p>
        <div class="level-bar" aria-hidden="true">
          <div class="level-fill" id="level-fill"></div>
        </div>
      </div>

      <p class="status" id="mic-status">マイクを開始して楽器や声を当ててください</p>
    </section>

    <section class="panel soundback-panel" aria-labelledby="soundback-heading">
      <div class="panel-head">
        <h2 id="soundback-heading" class="panel-title">Soundback</h2>
      </div>

      <p class="soundback-desc">
        検出中の音の<strong>正しい基準音</strong>を再生します。<br>
        ボタンを押している間だけ鳴ります（長押し対応）。
      </p>

      <button
        type="button"
        id="soundback-btn"
        class="btn btn-soundback"
        aria-pressed="false"
        disabled
      >
        <span class="soundback-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </span>
        <span class="btn-label" id="soundback-label">押して基準音を再生</span>
      </button>

      <div class="soundback-meta">
        <span class="meta-item">対象: <strong id="target-note">—</strong></span>
        <span class="meta-item"><span id="target-freq">—</span> Hz</span>
      </div>

      <div class="control-group volume-group">
        <label for="volume-slider">音量 <span id="volume-value">40%</span></label>
        <input type="range" id="volume-slider" class="slider" min="0" max="100" value="40">
      </div>
    </section>

    <footer class="footer">
      <p>Equal temperament · A4 = 440 Hz</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
