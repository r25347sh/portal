<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morse Key — Voice Amplitude</title>
  <meta name="description" content="声や音の大きさでモールス信号を打つ練習">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="noise"></div>
  </div>

  <main class="app">
    <header class="header">
      <a href="../" class="back-link" aria-label="Portalへ戻る">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Portal</span>
      </a>
      <h1 class="title">Morse Key</h1>
      <p class="subtitle">声・音の dB で打鍵</p>
    </header>

    <section class="panel">
      <p class="lead">
        マイクに向かって<strong>声や音を出す</strong>と、音量の盛り上がりで<br>
        トン（・）／ツー（−）を判定します。口笛・ハミングでも可。
      </p>

      <button type="button" id="mic-toggle" class="btn btn-primary btn-block" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <span class="btn-label">マイク開始</span>
      </button>

      <p class="status" id="status">マイクを開始してください</p>

      <div class="meter-block">
        <div class="meter-labels">
          <span>入力レベル</span>
          <span id="db-readout">— dB</span>
        </div>
        <div class="meter-track">
          <div class="meter-threshold" id="threshold-mark"></div>
          <div class="meter-fill" id="level-fill"></div>
        </div>
        <label class="setting">
          <span>しきい値 <strong id="thresh-value">-35</strong> dB</span>
          <input type="range" id="thresh" class="slider" min="-60" max="-15" value="-35">
        </label>
      </div>

      <div class="key-state" id="key-state">
        <span class="key-dot" id="key-indicator"></span>
        <span id="key-label">OFF</span>
      </div>
    </section>

    <section class="panel">
      <div class="output-head">
        <h2 class="panel-title">受信バッファ</h2>
        <button type="button" id="clear-btn" class="btn btn-ghost">クリア</button>
      </div>

      <div class="morse-line" id="morse-line" aria-live="polite">—</div>
      <div class="text-line" id="text-line">—</div>

      <div class="timing-row">
        <label class="setting compact">
          <span>基準ユニット <strong id="unit-value">80</strong> ms</span>
          <input type="range" id="unit" class="slider" min="40" max="200" value="80" step="5">
        </label>
        <p class="hint muted">短音 ≈ 1u / 長音 ≈ 3u / 字間 ≈ 3u / 語間 ≈ 7u</p>
      </div>
    </section>

    <details class="panel ref-panel">
      <summary>モールス符号表（タップで再生）</summary>
      <div class="ref-grid" id="ref-grid"></div>
    </details>

    <footer class="footer">
      <p>Amplitude keying · Web Audio Analyser</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
